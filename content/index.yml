faq:
  title: Foire Aux Questions (FAQ)
  description: Réponses aux questions courantes sur mes compétences et ma façon de travailler.
  categories:
    - title: Compétences & Processus
      questions:
        - label: Quelles sont tes spécialités ?
          content: |
            Je suis spécialisé en développement logiciel et programmation système. Bien que je sache coder en HTML, CSS, JS, React ou Vuejs, ma véritable passion se trouve côté machine. J'aime utiliser le C, C++, Rust, Java ou Spring Boot pour créer des back-ends solides, optimiser les performances et concevoir des architectures complexes bien loin du web pur et dur.
        - label: Comment as-tu appris à coder ?
          content: |
            Je suis passionné par l'informatique depuis tout petit. J'ai commencé à me former en autodidacte à l'âge de 11 ans, en développant des plugins Minecraft en Java. Cette curiosité ne m'a jamais quitté, et c'est ce qui m'a poussé à explorer de nombreux langages et à intégrer mon BUT Informatique actuel pour consolider mes bases techniques.
        - label: Quel est ton environnement de prédilection ?
          content: |
            Absolument tout ce qui touche à la logique pure et aux langages bas niveau ! J'aime comprendre comment la mémoire est gérée, comment les processus communiquent et comment tirer le meilleur parti des ressources matérielles. C'est dans ce genre d'environnement technique que je suis le plus efficace.
    - title: Disponibilités & Projets
      questions:
        - label: Cherches-tu des stages ou des missions ?
          content: |
            Étant actuellement en première année de BUT Informatique, je suis très ouvert aux opportunités de stages ou de projets qui me permettraient de mettre en pratique mes compétences en développement logiciel (C, C++, Rust, Java). Les missions axées sur le back-end et l'optimisation m'intéressent tout particulièrement.
        - label: Comment factures-tu tes services freelance ?
          content: |
            Si je prends des missions en parallèle de mes études, mes tarifs varient selon la complexité technique du projet. Pour des missions de développement back-end, d'outillage ou d'optimisation d'algorithmes, nous pouvons en discuter ensemble pour établir un devis juste, adapté à l'ampleur de la tâche et à mon statut d'étudiant.
        - label: Combien de temps prend un projet avec toi ?
          content: |
            Les délais dépendent fortement de la complexité de l'architecture à mettre en place et de mon emploi du temps étudiant. Un petit outil en ligne de commande peut prendre quelques semaines, tandis qu'un back-end complet demandera plusieurs mois. Je fournis toujours une estimation claire avant de commencer.
        - label: Fais-tu aussi de la création d'interface (UI) ?
          content: |
            Je maîtrise les technologies front-end (React, Vue, HTML/CSS), mais ce n'est vraiment pas ce que je préfère. Je suis beaucoup plus épanoui et efficace lorsqu'il s'agit de travailler sur l'architecture de l'application, les bases de données, l'algorithmique et le côté purement "machine".
    - title: À propos de moi
      questions:
        - label: Qu'est-ce qui te plaît le plus dans le développement ?
          content: |
            J'adore le défi intellectuel que représente la résolution de problèmes complexes. Ce qui m'excite, c'est de comprendre ce qui se passe sous le capot, d'écrire un code propre, performant et optimisé. Comprendre comment la machine interprète chaque instruction est fascinant.
        - label: Que fais-tu en dehors de l'informatique ?
          content: |
            Quand je ne suis pas plongé dans mon code ou mes cours à l'IUT, j'aime profiter de la région d'Aix-en-Provence pour me ressourcer. J'apprécie les balades, découvrir de nouveaux endroits et continuer à m'informer sur les dernières avancées technologiques ou matérielles.