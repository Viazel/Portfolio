about:
  title: "À propos"
  description: |
    Étudiant en première année de BUT Informatique à Aix-en-Provence, je me passionne pour le développement logiciel et les systèmes bas niveau. Autodidacte depuis l'âge de 11 ans, j'ai commencé par créer des plugins Minecraft en Java !
    Aujourd'hui, mon approche se concentre sur l'aspect purement technique et machine. Je maîtrise une large palette de langages (C, C++, Rust, Java, mais aussi TS ou Spring Boot) pour construire des architectures robustes et parfaitement optimisées.
